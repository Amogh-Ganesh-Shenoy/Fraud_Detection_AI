# Project root render.yaml — read by Render at build time
# Tells Render how to install dependencies and start the FastAPI server
# Without this file, Render would not know how to run the project

services:
  - type: web
    name: uae-fraud-detection-api
    env: python
    
    # Force Python 3.11 — psycopg2-binary 2.9.9 is incompatible with Python 3.14
    # Render was defaulting to 3.14, causing ABI symbol errors on import
    pythonVersion: "3.11.0"
    
    # Render runs this command first to install all packages from requirements.txt
    buildCommand: pip install -r requirements.txt
    
    # $PORT is dynamically assigned by Render — never hardcode 8000
    # Render's health check will fail if the server binds to the wrong port
    startCommand: uvicorn api.main:app --host 0.0.0.0 --port $PORT
    
    envVars:
      - key: DB_PATH
        value: data/fraud.db
      - key: DASHBOARD_USERNAME
        sync: false
      - key: DASHBOARD_PASSWORD
        sync: false
      - key: SENDGRID_API_KEY
        sync: false
      - key: ALERT_EMAIL
        sync: false
      - key: JWT_SECRET_KEY
        sync: false
      - key: JWT_ALGORITHM
        value: HS256
      - key: JWT_EXPIRE_MINUTES
        value: 60